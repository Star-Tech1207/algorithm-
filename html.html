<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sentence Analyzer</title>
</head>
<body>
  <h2>Sentence Analyzer</h2>
  <p>Enter a sentence ending with a period.</p>
  <button onclick="analyzeSentence()">Analyze</button>
  <div id="output"></div>

  <script>
    function analyzeSentence() {
      // Ask user for input
      let sentence = prompt("Enter a sentence ending with a period:");

      // Initialize counters
      let length = 0;
      let words = 0;
      let vowels = 0;

      // Vowel set
      let vowelSet = "aeiouAEIOU";

      // Process character by character until the period
      for (let i = 0; i < sentence.length; i++) {
        let char = sentence[i];

        if (char === ".") {
          break; // stop at the period
        }

        length++; // count character

        if (vowelSet.includes(char)) {
          vowels++; // count vowel
        }

        if (char === " ") {
          words++; // count spaces as separators
        }
      }

      // Add 1 for the last word before the period
      words++;

      // Display results
      let result = `
        <p><strong>Length of sentence (without period):</strong> ${length}</p>
        <p><strong>Number of words:</strong> ${words}</p>
        <p><strong>Number of vowels:</strong> ${vowels}</p>
      `;
      document.getElementById("output").innerHTML = result;
    }
  </script>
</body>
</html>
